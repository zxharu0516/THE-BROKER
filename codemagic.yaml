workflows:
  the-broker-ios:
    name: THE BROKER - iOS / App Store Connect
    max_build_duration: 120
    instance_type: mac_mini_m2

    # Codemagicの Team settings > Developer Portal で
    # App Store Connect API key の表示名を THE_BROKER_ASC にしてください。
    integrations:
      app_store_connect: THE_BROKER_ASC

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kuwada.thebroker
      vars:
        BUNDLE_ID: "com.kuwada.thebroker"
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_VERSION: "1.0.0"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm install --no-audit --no-fund

      - name: Create fresh Capacitor iOS project
        script: |
          rm -rf ios
          npx cap add ios

      - name: Generate native app icon and splash assets
        script: |
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#071018' \
            --iconBackgroundColorDark '#071018' \
            --splashBackgroundColor '#071018' \
            --splashBackgroundColorDark '#071018'

      - name: Sync THE BROKER web game into iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set app version and Codemagic build number
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          p = Path('ios/App/App.xcodeproj/project.pbxproj')
          text = p.read_text()
          build = os.environ.get('PROJECT_BUILD_NUMBER') or os.environ.get('BUILD_NUMBER') or '1'
          version = os.environ.get('APP_VERSION', '1.0.0')

          text, n_build = re.subn(
              r'CURRENT_PROJECT_VERSION = [^;]+;',
              f'CURRENT_PROJECT_VERSION = {build};',
              text,
          )
          text, n_version = re.subn(
              r'MARKETING_VERSION = [^;]+;',
              f'MARKETING_VERSION = {version};',
              text,
          )
          if n_build == 0 or n_version == 0:
              raise SystemExit('Could not update iOS version settings')
          p.write_text(text)
          print(f'iOS version {version} ({build})')
          PY

      - name: Apply App Store signing profile
        script: |
          xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Build signed IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # 最初はApp Store Connectへアップロードだけ行います。
        # TestFlightの外部審査やApp Store審査提出は、内容確認後に手動で行えます。
        submit_to_testflight: false
        submit_to_app_store: false
